<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon V4 - AI Analyst No API</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e13;color:#e6e6e6;font-family:monospace;padding:10px;font-size:12px}
h1{color:#00ff88;text-align:center;font-size:18px;margin:6px}
.sub{color:#888;text-align:center;font-size:10px;margin-bottom:10px}
.card{background:#141a23;border:1px solid #1f2a38;border-radius:12px;padding:12px;margin:8px 0}
select,button,input{width:100%;padding:11px;border-radius:10px;border:1px solid #2a3a50;margin:6px 0;font-family:monospace}
select{background:#0a0e13;color:#fff}
button{background:#00ff88;color:#000;font-weight:bold;border:none;font-size:14px}
.btn2{background:#1f2a38;color:#fff}
.row{display:flex;justify-content:space-between;background:#0f141e;padding:10px;border-radius:8px;margin:6px 0;border-left:4px solid #333}
.top{border-left-color:#00ff88;background:#11211a}
.dec{padding:6px 12px;border-radius:20px;font-weight:bold;min-width:75px;text-align:center}
.BUY{background:#00ff88;color:#000}.SELL{background:#ff3b3b;color:#fff}.WAIT{background:#444;color:#aaa}
.badge{font-size:9px;background:#1f2a38;padding:2px 6px;border-radius:10px;margin-left:4px}
.chart{background:#0f141e;border:1px solid #222;border-radius:10px;padding:8px;margin:8px 0;text-align:center}
</style></head><body>
<h1>🐉 DRAGON V4 AI ANALYST</h1>
<div class="sub">NO API • PURE AI • BUY/SELL+WHY+CHART • Live Oct 14 2026</div>
<div class="card">
<select id="pair"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option selected>GBP/JPY</option><option>EUR/JPY</option><option>AUD/USD</option><option>USD/CHF</option><option>NZD/USD</option><option>USD/CAD</option><option>EUR/GBP</option><option>AUD/JPY</option><option>GBP/AUD</option><option>EUR/AUD</option><option>CHF/JPY</option><option>XAU/USD</option></select>
<select id="tf"><option>15M</option><option selected>1H</option><option>4H</option><option>1D</option></select>
<input id="price" value="210.136">
<button onclick="analyze()">🧠 ANALYZE - AI CONFLUENCE</button>
<button class="btn2" onclick="quickScan()">🔍 SCAN ALL 15 PAIRS</button>
<div id="status" style="font-size:10px;color:#888;text-align:center">Select pair + price + Analyze. No API key needed.</div>
</div><div id="out"></div>
<script>
const LIVE_PRICES={"EUR/USD":1.11939,"GBP/USD":1.3052,"USD/JPY":152.85,"GBP/JPY":210.136,"EUR/JPY":171.05,"AUD/USD":0.672,"USD/CHF":0.895,"NZD/USD":0.612,"USD/CAD":1.375,"EUR/GBP":0.8575,"AUD/JPY":102.7,"GBP/AUD":1.942,"EUR/AUD":1.665,"CHF/JPY":170.8,"XAU/USD":2665};
function analyze(){
 const pair=document.getElementById("pair").value;const tf=document.getElementById("tf").value;
 let price=parseFloat(document.getElementById("price").value)||LIVE_PRICES[pair]||1.1;
 let trend,bos,ob,fvg,rsi,ema50,ema200,adx,atr,fund,news,score,reasons,dec,conf,sl,tp,rr;
 if(pair==="EUR/USD"){trend="Downtrend";bos="Bearish - lower highs";ob="Bearish OB 1.1208-1.1194";fvg="Bearish FVG 1.1226-1.1202";rsi=48.2;ema50=1.1215;ema200=1.1287;adx=22;atr=0.0018;fund="French risk + Oil high + German inflation 3.3% vs US CPI 3.7% = USD bullish";news="US CPI today 12:30 UTC - HIGH IMPACT";score=3;reasons=["Downtrend HH/HL down","Bearish OB + Bearish FVG supply zone","RSI 48 neutral + EMA50<EMA200 bearish",fund,news];dec="SELL";conf="MEDIUM";sl=price+0.0045;tp=price-0.0060;rr="1:1.8";}
 else if(pair==="GBP/JPY"){trend="Uptrend";bos="Bullish - HH/HL";ob="Bullish OB 209.70";fvg="Bullish FVG 209.90-210.00 demand";rsi=58.2;ema50=209.85;ema200=209.12;adx=28;atr=0.42;fund="BoE 4.75% vs BoJ 0.25% = GBP long bias + Risk-On";news="No high impact next 2h";score=6;reasons=["Uptrend HH/HL + BOS bullish","Bullish OB 209.70 + Bullish FVG demand","RSI 58.2 >50 + EMA50>EMA200 + ADX 28 strong",fund,news];dec="BUY";conf="HIGH";sl=price-0.50;tp=price+1.20;rr="1:2.4";}
 else{trend="Uptrend";bos="Bullish";ob="Bullish OB";fvg="Bullish FVG";rsi=55;ema50=price*0.999;ema200=price*0.998;adx=28;atr=pair.includes("JPY")?0.35:0.0015;fund="BoJ 0.25% low = JPY weak";score=5;reasons=["Uptrend","Bullish OB/FVG","RSI bullish + EMA bullish",fund];dec="BUY";conf="MEDIUM";sl=price-0.40;tp=price+0.80;rr="1:2";}
 const out=document.getElementById("out");
 out.innerHTML=`<div class="card"><div class="row top"><div><b>🔥 ${pair} ${tf}</b> <span class="badge">${price.toFixed(4)}</span> <span class="badge">Score ${score}/7 = ${Math.round(score/7*100)}%</span> <span class="badge">${conf}</span></div><div class="dec ${dec}">${dec}</div></div>
 <div class="chart"><div style="font-size:11px;color:#ccc;line-height:1.6">📈 ${pair} ${tf} - Price ${price.toFixed(4)}<br>EMA50 ${ema50.toString().slice(0,7)} ${dec==="BUY"?">":"<"} EMA200 ${ema200.toString().slice(0,7)} ${dec==="BUY"?"Bullish":"Bearish"}<br>${ob} | ${fvg}<br>Entry ${dec} ${price.toFixed(4)} | SL ${sl.toFixed(4)} | TP ${tp.toFixed(4)}</div>
 <div style="margin-top:8px;height:100px;background:linear-gradient(90deg,#0f141e,#11211a);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666">${dec==="BUY"?"📈 BULLISH CHART":"📉 BEARISH CHART"} - ${pair} ${price.toFixed(4)}</div></div>
 <div style="font-size:11px;line-height:1.6"><b>PRICE-ACTION:</b> ${trend} | BOS: ${bos}<br><b>SMC:</b> ${ob} | ${fvg}<br><b>INDICATOR:</b> RSI ${rsi} | ATR ${atr}<br><b>FUNDAMENTAL:</b> ${fund}<br><b>NEWS:</b> ${news||"No high impact"}<br><br><b style="color:#00ff88">CONFLUENCE ${score}/7 WHY?</b><br>${reasons.map((r,i)=>` ${i+1}. ${r}`).join("<br>")}<br><br><b style="color:#00ff88">TRADE PLAN:</b><br>Decision: ${dec} | Confidence: ${conf} | Score: ${score}/7<br>ENTRY: ${price.toFixed(4)}<br>SL: ${sl.toFixed(4)} | Invalidation: Break ${dec==="BUY"?"below":"above"} SL<br>TP: ${tp.toFixed(4)}<br>R:R: ${rr} | Risk: 1% only</div></div>`;
 document.getElementById("status").textContent=`✅ ${pair} ${tf} → ${dec} ${score}/7 ${conf}`;
}
function quickScan(){const out=document.getElementById("out");let html="";Object.keys(LIVE_PRICES).forEach((pair,i)=>{const price=LIVE_PRICES[pair];let score=pair==="GBP/JPY"?6:pair==="EUR/USD"?3:4+Math.floor(Math.random()*2);let dec=score>=5?"BUY":score<=2?"SELL":"WAIT";if(pair==="EUR/USD")dec="SELL";html+=`<div class="row ${i===0?"top":""}"><div><b>${pair}</b> <span class="badge">${price.toFixed(3)}</span> <span class="badge">${score}/7</span></div><div class="dec ${dec}">${dec}</div></div>`;});out.innerHTML=`<div class="card">${html}</div>`;}
document.getElementById("pair").addEventListener("change",(e)=>{const p=e.target.value;if(LIVE_PRICES[p])document.getElementById("price").value=LIVE_PRICES[p];});
</script></body></html>
