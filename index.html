<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JM Forex Confluence AI - Real Data</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
background:#0a0e13;
color:#e6e6e6;
font-family:monospace;
padding:10px;
font-size:11px
}

h1{
color:#00ff88;
text-align:center;
font-size:17px
}

.sub{
color:#888;
text-align:center;
font-size:9px;
margin-bottom:8px
}

.card{
background:#141a23;
border:1px solid #1f2a38;
border-radius:14px;
padding:10px;
margin:8px 0
}

input,select,button{
width:100%;
padding:11px;
border-radius:10px;
border:1px solid #2a3a50;
margin:5px 0;
font-family:monospace
}

input,select{
background:#0a0e13;
color:#fff
}

button{
background:#00ff88;
color:#000;
font-weight:bold;
border:none;
cursor:pointer
}

.btn2{
background:#1f2a38;
color:#fff
}

.row{
display:flex;
justify-content:space-between;
background:#0f141e;
padding:9px;
border-radius:10px;
margin:6px 0;
border-left:4px solid #333;
align-items:center;
gap:8px
}

.top{
border-left-color:#00ff88;
background:#11211a
}

.dec{
padding:6px 12px;
border-radius:20px;
font-weight:bold;
min-width:78px;
text-align:center
}

.BUY{
background:#00ff88;
color:#000
}

.SELL{
background:#ff3b3b;
color:#fff
}

.WAIT{
background:#ffcc00;
color:#000
}

.NO{
background:#777;
color:#fff
}

.badge{
font-size:8px;
background:#1f2a38;
padding:2px 6px;
border-radius:10px;
margin-left:4px
}

.ok{
background:#0a1a0a;
border:1px solid #00ff88;
border-radius:10px;
padding:8px;
margin:8px 0
}

.warn{
background:#1a1608;
border:1px solid #ffcc00;
border-radius:10px;
padding:8px;
margin:8px 0
}

.err{
background:#1b0b0b;
border:1px solid #ff3b3b;
border-radius:10px;
padding:8px;
margin:8px 0
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px
}

.metric{
background:#0f141e;
border:1px solid #202c3b;
border-radius:10px;
padding:8px
}

.metric b{
display:block;
color:#7aa7ff;
font-size:8px;
margin-bottom:3px
}

.small{
font-size:8px;
color:#888
}

.signal{
font-size:18px;
text-align:center;
font-weight:bold;
padding:12px;
border-radius:12px;
margin:8px 0
}
</style>
</head>

<body>

<h1>🐉 JM FOREX CONFLUENCE AI</h1>

<div class="sub">
DRAGON V6.3 CORE + REAL MARKET DATA + MULTI-TIMEFRAME CONFLUENCE
</div>

<div class="card">

<select id="pair">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>NZD/USD</option>
<option>EUR/JPY</option>
<option>GBP/JPY</option>
<option selected>XAU/USD</option>
</select>

<select id="tf">
<option>15M</option>
<option selected>1H</option>
<option>4H</option>
<option>5M</option>
<option>1M</option>
</select>

<button onclick="analyze()">
🧠 RUN REAL CONFLUENCE ANALYSIS
</button>

<button class="btn2" onclick="scanAll()">
🔍 SCAN ALL PAIRS
</button>

<div id="status"
style="text-align:center;color:#888;font-size:8px;margin-top:5px">
Ready — backend connection not tested yet.
</div>

</div>

<div id="out"></div>

<script>

const API_BASE = "";

const esc = s =>
String(s ?? "").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

const cls = s =>
s==="BUY"||s==="SELL"||s==="WAIT"
?s:"NO";


function metric(name,value){

return `
<div class="metric">
<b>${esc(name)}</b>
${esc(value)}
</div>
`;

}


function renderResult(r){

const signal=r.signal || "NO TRADE";

const signalClass=cls(signal);

const score=Number(r.score || 0);

const price=r.price ?? "—";


const rows=(r.timeframes||[]).map(x=>`

<div class="row">

<div>
<b>${esc(x.tf)}</b>

<span class="badge">
${esc(x.bias)}
</span>

<br>

<span class="small">
${esc(x.reason)}
</span>

</div>

<div class="dec ${cls(x.bias)}">
${esc(x.bias)}
</div>

</div>

`).join("");


const reasons=(r.reasons||[])
.map(x=>`<li>${esc(x)}</li>`)
.join("");


const risks=(r.risks||[])
.map(x=>`<li>${esc(x)}</li>`)
.join("");


document.getElementById("out").innerHTML=`

<div class="card">

<div class="signal ${signalClass}">
${esc(signal)} • CONFLUENCE ${score}/100
</div>


<div class="row top">

<div>

<b>${esc(r.symbol)}</b>

<br>

<span class="small">
Latest close: ${esc(price)}
• Data: ${esc(r.dataStatus||"REAL")}
</span>

</div>

<div class="dec ${signalClass}">
${esc(signal)}
</div>

</div>


<div class="grid">

${metric("4H STRUCTURE",r.structure?.h4)}

${metric("1H STRUCTURE",r.structure?.h1)}

${metric("15M STRUCTURE",r.structure?.m15)}

${metric("RSI",r.indicators?.rsi)}

${metric("MACD",r.indicators?.macd)}

${metric("EMA TREND",r.indicators?.ema)}

${metric("ATR",r.indicators?.atr)}

${metric("BOLLINGER",r.indicators?.bollinger)}

</div>


<div class="card" style="margin:8px 0 0">

<b style="color:#7aa7ff">
📊 MULTI-TIMEFRAME
</b>

${rows}

</div>


<div class="ok">

<b style="color:#00ff88">
🧠 WHY THIS SIGNAL
</b>

<ul style="padding-left:18px;line-height:1.5;margin-top:5px">

${reasons ||
"<li>No confirmed confluence yet.</li>"}

</ul>

</div>


<div class="warn">

<b style="color:#ffcc00">
⚠️ RISKS / INVALIDATION
</b>

<ul style="padding-left:18px;line-height:1.5;margin-top:5px">

${risks ||
"<li>Risk layer available; confirm manually before trading.</li>"}

</ul>

</div>


<div class="grid">

${metric("BOS / CHOCH",r.smc?.bos)}

${metric("LIQUIDITY",r.smc?.liquidity)}

${metric("FVG",r.smc?.fvg)}

${metric("ORDER BLOCK",r.smc?.orderBlock)}

${metric("PREMIUM / DISCOUNT",r.smc?.premiumDiscount)}

${metric("CANDLE",r.candle)}

</div>


<div class="row">

<div>

<b>Trade plan</b>

<br>

<span class="small">

${esc(
r.plan?.note ||
"No automatic entry until sufficient confluence is confirmed."
)}

</span>

</div>

<div style="text-align:right">

<b>R:R</b>

<br>

${esc(r.plan?.rr||"—")}

</div>

</div>


<div class="small">

Research/analysis tool only.
A confluence score is not a guarantee of future price movement.

</div>

</div>
`;

}


async function analyze(){

const pair=document.getElementById("pair").value;

const tf=document.getElementById("tf").value;

const status=document.getElementById("status");

status.textContent=
"⏳ Fetching real market data and calculating confluence...";


try{

const res=await fetch(
`${API_BASE}/api/analyze?symbol=${encodeURIComponent(pair)}&tf=${encodeURIComponent(tf)}`,
{
cache:"no-store"
}
);


const data=await res.json();


if(!res.ok)
throw new Error(
data.error || "Backend request failed"
);


renderResult(data);


status.textContent=
`✅ REAL DATA • ${pair} • Updated ${new Date().toLocaleTimeString()}`;


}catch(e){

document.getElementById("out").innerHTML=`

<div class="card">

<div class="err">

<b>REAL DATA NOT CONNECTED</b>

<br>

${esc(e.message)}

<br><br>

Deploy the backend and keep the Twelve Data API key
on the server.

Do not put the key in this HTML.

</div>

</div>

`;

status.textContent="❌ Backend unavailable";

}

}


async function scanAll(){

const pairs=[
...document.getElementById("pair").options
].map(o=>o.value);


const out=document.getElementById("out");

const status=document.getElementById("status");


status.textContent="⏳ Scanning pairs...";


out.innerHTML=`

<div class="card">

<div class="warn">

Scanning real data.
This may take a moment because each pair requires
market-data requests.

</div>

</div>

`;


const results=[];


for(const p of pairs){

try{

const res=await fetch(
`${API_BASE}/api/analyze?symbol=${encodeURIComponent(p)}&tf=1H`,
{
cache:"no-store"
}
);


const d=await res.json();


results.push(`

<div class="row">

<div>

<b>${esc(p)}</b>

<br>

<span class="small">

Score ${esc(d.score)}
•
${esc(d.dataStatus)}

</span>

</div>

<div class="dec ${cls(d.signal)}">

${esc(d.signal)}

</div>

</div>

`);

}catch(e){

results.push(`

<div class="row">

<div>

<b>${esc(p)}</b>

<br>

<span class="small">
Unavailable
</span>

</div>

<div class="dec NO">
NO DATA
</div>

</div>

`);

}

}


out.innerHTML=`

<div class="card">

<b>🔍 REAL-DATA SCAN</b>

${results.join("")}

</div>

`;


status.textContent=
`✅ Scan complete • ${new Date().toLocaleTimeString()}`;

}

</script>

</body>
</html>
