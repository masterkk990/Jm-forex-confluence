<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JM FOREX CONFLUENCE AI - REAL</title>
<style>
:root{color-scheme:dark;--bg:#080d14;--card:#131d2b;--line:#2a3c52;--green:#00f09a;--yellow:#ffd166;--muted:#9aabc0}
*{box-sizing:border-box}body{margin:auto;max-width:900px;padding:12px;background:var(--bg);color:#edf4fc;font:13px system-ui}
h1{text-align:center;color:var(--green);margin:8px 0} .sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;color:#a9c7ef;margin:8px 0 5px} select,button{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0a121c;color:#fff}
button{background:var(--green);color:#03150e;font-weight:800;border:0;cursor:pointer} button.sec{background:#22344a;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.status{text-align:center;padding:9px;background:#0a121c;border-radius:8px;color:var(--yellow);margin-top:8px}
.note{color:var(--muted);font-size:11px;line-height:1.5}
.signal{padding:11px;border:1px solid var(--line);border-radius:9px;background:#0c1826;margin:8px 0}
.green{color:var(--green)}.red{color:#ff6376}
</style>
</head>
<body>
<h1>🐍 JM FOREX CONFLUENCE AI</h1>
<div class="sub">REAL MARKET DATA · TECHNICAL ANALYSIS · NO RANDOM SIGNALS · NO API KEY</div>

<div class="card">
<label>Market - REAL Deriv Feed (tracks real interbank)</label>
<select id="market">
<option value="frxXAUUSD">XAU/USD - Gold REAL</option>
<option value="frxEURUSD">EUR/USD REAL</option>
<option value="frxGBPUSD">GBP/USD REAL</option>
<option value="frxUSDJPY">USD/JPY REAL</option>
<option value="frxAUDUSD">AUD/USD REAL</option>
<option value="frxUSDCAD">USD/CAD REAL</option>
<option value="frxUSDCHF">USD/CHF REAL</option>
<option value="frxEURJPY">EUR/JPY REAL</option>
<option value="frxGBPJPY">GBP/JPY REAL</option>
<option value="frxEURGBP">EUR/GBP REAL</option>
</select>
<label>Execution timeframe</label>
<select id="tf"><option value="60">1 minute</option><option value="300">
