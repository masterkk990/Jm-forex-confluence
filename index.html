<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JM FOREX CONFLUENCE AI</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#080d14;--card:#161f2e;--line:#2a3b52;--green:#00e99a;--red:#ff6376;--yellow:#ffd166;--muted:#9aabc0}
*{box-sizing:border-box}body{margin:auto;max-width:1100px;padding:12px;background:var(--bg);color:#edf4fc;font:13px system-ui}
h1{text-align:center;color:var(--green);margin:6px}.sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{color:#a9c7ef;margin:8px 0 6px;display:block} select,button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a121c;color:#fff}
button{background:var(--green);color:#03150e;font-weight:900;border:0;margin-top:10px} button.sec{background:#22344a;color:#fff}
.status{text-align:center;padding:10px;background:#09111b;border-radius:8px;color:var(--yellow);margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e2f44}
.kv:last-child{border:0}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}
.bull{background:rgba(0,233,154,.15);color:var(--green)}.bear{background:rgba(255,99,118,.15);color:var(--red)}
.big{font-size:26px;font-weight:900;text-align:center}
.reason{padding:8px 10px;margin:6px 0;background:#0c1826;border-left:3px solid var(--green);border-radius:6px}
</style>
</head>
<body>
<h1>🐍 JM FOREX CONFLUENCE AI</h1>
<div class="sub">REAL MARKET · INSTITUTIONAL · CHART · SNIPER · REASONS · NO API KEY</div>

<div class="card">
<div class="grid2">
<div><label>Market - REAL</label><select id="market"><option value="XAUUSD=X" selected>XAU/USD - Gold REAL</option><option value="EURUSD=X">EUR/USD</option><option value="GBPUSD=X">GBP/USD</option><option value="USDJPY=X">USD/JPY</option><option value="AUDUSD=X">AUD/USD</option><option value="BTC-USD">BTC/USD</option></select></div>
<div><label>Execution timeframe</label><select id="tf"><option value="1m">1m</option><option value="5m">5m</option><option value="15m" selected>15m</option><option value="30m">30m</option><option value="60m">1h</option><option value="1d">1D</option></select></div>
</div>
<button id="run">🧠 RUN CONFLUENCE ANALYSIS</button>
<button id="scan" class="sec">🔍 SCAN ALL MARKETS</button>
<div id="status" class="status">Ready - HTTPS real data</div>
</div>

<div class="card"><h2>📊 Chart - Live Real Price</h2><div id="chart" style="height:340px"></div><div id="price" class="big">—</div></div>

<div class="grid2">
<div class="card"><h2>🏛️ Institutional</h2><div id="inst">Press RUN</div></div>
<div class="card"><h2>🎯 Sniper Entry</h2><div id="sniper">Press RUN</div></div>
</div>

<div class="card"><h2>🧩 Reasons - Confluence</h2><div id="reasons">Press RUN</div></div>
<div class="card"><h2>Confluence Result</h2><div id="result">Waiting...</div></div>

<script>
const $=id=>document.getElementById(id);
let chart, candleSeries;
function initChart(){const el=$("chart"); chart=LightweightCharts.createChart(el,{layout:{background:{color:"#161f2e"},textColor:"#9aabc0"},grid:{vertLines:{color:"#1e2f44"},horzLines:{color:"#1e2f44"}},width:el.clientWidth,height:340}); candleSeries=chart.addCandlestickSeries(); }
initChart();
function ema(a,p){let k=2/(p+1),e=a[0];for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}
function rsiCalc(c){let g=0,l=0;for(let i=c.length-14;i<c.length;i++){let d=c[i]-c[i-1];if(d>0)g+=d;else l-=d;}return l==0?100:100-100/(1+g/l);}

async function fetchYahoo(symbol, interval){
 const url=`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=${interval}&range=10d`;
 const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
 const r=await fetch(proxy); if(!r.ok) throw "fetch failed "+r.status;
 const j=await r.json(); const res=j.chart.result[0]; const q=res.indicators.quote[0]; const ts=res.timestamp;
 const candles=[]; for(let i=0;i<ts.length;i++){ if(q.close[i]==null) continue; candles.push({time:ts[i], open:q.open[i], high:q.high[i], low:q.low[i], close:q.close[i]}); }
 return candles;
}

async function run(){
 const sym=$("market").value, tf=$("tf").value;
 $("status").textContent="Fetching REAL "+sym+"...";
 try{
  const candles=await fetchYahoo(sym,tf);
  const closes=candles.map(c=>c.close);
  const last=candles[candles.length-1];
  candleSeries.setData(candles.slice(-200));
  $("price").textContent=last.close.toFixed(2);

  // INSTITUTIONAL
  const dayHigh=Math.max(...closes.slice(-96)), dayLow=Math.min(...closes.slice(-96));
  const obHigh=last.high, obLow=last.low;
  const fvg = closes[closes.length-2] < closes[closes.length-3]? "Bearish FVG" : "Bullish FVG";
  $("inst").innerHTML=`<div class="kv"><span>Daily High / Low</span><b>${dayHigh.toFixed(2)} / ${dayLow.toFixed(2)}</b></div><div class="kv"><span>Liquidity Sweep</span><span class="badge ${last.close>dayHigh?'bull':'bear'}">${last.close>dayHigh?"Highs swept":"Lows swept"}</span></div><div class="kv"><span>Order Block</span><b>${obLow.toFixed(2)} - ${obHigh.toFixed(2)}</b></div><div class="kv"><span>Fair Value Gap</span><b>${fvg}</b></div><div class="kv"><span>Market Structure</span><b>${closes[closes.length-1]>closes[closes.length-5]?"BOS Bullish":"BOS Bearish"}</b></div>`;

  // REASONS
  const e21=ema(closes.slice(-60),21), e50=ema(closes.slice(-90),50), r=rsiCalc(closes);
  let reasons=[];
  reasons.push({t:`Price ${last.close>e21?"above":"below"} EMA21 (${e21.toFixed(2)})`, ok:last.close>e21});
  reasons.push({t:`EMA21 ${e21>e50?"above":"below"} EMA50 - ${e21>e50?"Uptrend":"Downtrend"}`, ok:e21>e50});
  reasons.push({t:`RSI ${r.toFixed(1)} ${r>50?"momentum bullish":"bearish"}`, ok:r>50});
  reasons.push({t:`${fvg} detected`, ok:fvg.includes("Bullish")});
  reasons.push({t:`Close ${last.close>dayHigh*0.998?"near daily high - institutional buy":"below daily high"}`, ok:last.close>dayHigh*0.998});
  $("reasons").innerHTML=reasons.map(rr=>`<div class="reason" style="border-left-color:${rr.ok?'#00e99a':'#ff6376'}">${rr.ok?'✅':'⚠️'} ${rr.t}</div>`).join("");

  // SNIPER
  let score=reasons.filter(x=>x.ok).length;
  let sig=score>=3?"BUY":"SELL"; let entry=last.close;
  let sl=sig=="BUY"?entry*0.998:entry*1.002; let tp1=sig=="BUY"?entry*1.004:entry*0.996; let tp2=sig=="BUY"?entry*1.008:entry*0.992;
  $("sniper").innerHTML=`<div class="kv"><span>Signal</span><span class="badge ${sig=="BUY"?"bull":"bear"}">${sig} ${score}/5</span></div><div class="kv"><span>Entry</span><b>${entry.toFixed(2)}</b></div><div class="kv"><span>Stop Loss</span><b style="color:#ff6376">${sl.toFixed(2)}</b></div><div class="kv"><span>TP1 / TP2</span><b style="color:#00e99a">${tp1.toFixed(2)} / ${tp2.toFixed(2)}</b></div><div class="kv"><span>Risk:Reward</span><b>1 : 2.5</b></div>`;
  $("result").innerHTML=`<div style="padding:12px;background:#0c1826;border-radius:10px;border:1px solid #2a3b52"><b class="${sig=="BUY"?"green":"red"}" style="font-size:18px">${sig} CONFLUENCE ${score}/5</b> - ${sym} ${tf}<br><span style="color:#9aabc0">${reasons.filter(x=>x.ok).length} reasons aligned</span></div>`;
  $("status").textContent="LIVE REAL "+sym+" - All sections loaded";
 }catch(e){ $("status").textContent="Error: "+e; }
}
$("run").onclick=run;
window.onresize=()=>{ chart.applyOptions({width:$("chart").clientWidth}); };
</script>
</body>
</html>
