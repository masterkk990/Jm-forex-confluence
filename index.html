<script>
const PAIRS=["EUR/USD","GBP/USD","USD/JPY","GBP/JPY","EUR/JPY","AUD/USD","USD/CHF","NZD/USD","USD/CAD","EUR/GBP","AUD/JPY","GBP/AUD","EUR/AUD","CHF/JPY","XAU/USD"];
function log(m){document.getElementById("log").innerHTML+=m+"<br>"}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function fetchRealCandles(pair,apiKey){
 const url=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(pair)}&interval=1h&outputsize=200&apikey=${apiKey}`;
 try{const res=await fetch(url);const data=await res.json();if(data.status==="error"||!data.values){log(`❌ ${pair}: ${data.message}`);return null;}
 const candles=data.values.reverse().map(v=>({open:+v.open,high:+v.high,low:+v.low,close:+v.close,time:v.datetime}));
 log(`✅ ${pair}: ${candles.length} real last=${candles[candles.length-1].close}`);return candles;
 }catch(e){log(`❌ ${pair} ${e.message}`);return null;}
}
function ema(values,period){let k=2/(period+1),emaA=[],sum=0;for(let i=0;i<values.length;i++){if(i<period-1){sum+=values[i];continue;}if(i===period-1){sum+=values[i];emaA.push(sum/period);}else{emaA.push(values[i]*k+emaA[emaA.length-1]*(1-k));}}return emaA;}
function rsi(closes,p=14){let gains=0,losses=0;for(let i=1;i<=p;i++){let d=closes[i]-closes[i-1];if(d>=0)gains+=d;else losses-=d;}let ag=gains/p,al=losses/p,rs=[100-(100/(1+ag/(al||0.0001)))];for(let i=p+1;i<closes.length;i++){let d=closes[i]-closes[i-1],gain=d>0?d:0,loss=d<0?-d:0;ag=(ag*(p-1)+gain)/p;al=(al*(p-1)+loss)/p;rs.push(100-(100/(1+ag/(al||0.0001))));}return rs;}
function atr(candles,p=14){let trs=[];for(let i=1;i<candles.length;i++){trs.push(Math.max(candles[i].high-candles[i].low,Math.abs(candles[i].high-candles[i-1].close),Math.abs(candles[i].low-candles[i-1].close)));}let atrs=[],sum=trs.slice(0,p).reduce((a,b)=>a+b,0);atrs.push(sum/p);for(let i=p;i<trs.length;i++){atrs.push((atrs[atrs.length-1]*(p-1)+trs[i])/p);}return atrs;}
function getPA(candles){const last20=candles.slice(-20);const rh=Math.max(...last20.slice(-5).map(c=>c.high));const ph=Math.max(...last20.slice(-10,-5).map(c=>c.high));const rl=Math.min(...last20.slice(-5).map(c=>c.low));const pl=Math.min(...last20.slice(-10,-5).map(c=>c.low));const trend=rh>ph&&rl>pl?"uptrend":rh<ph&&rl<pl?"downtrend":"range";const bos=rh>ph?"bullish":rl<pl?"bearish":"none";return {trend,bos};}
function getSMC(candles){const last=candles[candles.length-1],prev=candles[candles.length-2];const ob=prev.close<prev.open&&last.close>prev.high?"bullish":prev.close>prev.open&&last.close<prev.low?"bearish":"none";const c1=candles[candles.length-3],c3=candles[candles.length-1];let fvg="none";if(c1&&c3&&c1.high<c3.low)fvg="bullish";if(c1&&c3&&c1.low>c3.high)fvg="bearish";return {ob,fvg};}
function confluenceReal(pair,candles,ind){let score=0,reasons=[];const {trend,bos}=ind.pa;const {ob,fvg}=ind.smc;const rsiLast=ind.rsi[ind.rsi.length-1];const ema50=ind.ema50[ind.ema50.length-1];const ema200=ind.ema200[ind.ema200.length-1];const atrL=ind.atr[ind.atr.length-1];const price=candles[candles.length-1].close;
 if(trend==="uptrend"&&bos==="bullish"){score+=2;reasons.push(`HH/HL up + BOS bullish`);}else if(trend==="uptrend"){score+=1;reasons.push(`Uptrend`);}
 if(ob==="bullish"&&fvg==="bullish"){score+=2;reasons.push(`OB bullish + FVG`);}else if(ob!=="none"||fvg!=="none"){score+=1;reasons.push(`SMC ${ob}/${fvg}`);}
 if(rsiLast>50&&ema50>ema200){score+=2;reasons.push(`RSI ${rsiLast.toFixed(1)}>50 + EMA50>200`);}else if(rsiLast>50){score+=1;reasons.push(`RSI ${rsiLast.toFixed(1)} bullish`);}
 let fund="Neutral";if(pair==="GBP/JPY")fund="BoE 4.75% vs BoJ 0.25%";else if(pair==="USD/JPY")fund="Fed 4.5% vs BoJ 0.25%";else if(pair==="XAU/USD")fund="Gold inverse DXY";score+=1;reasons.push(fund);
 let decision="WAIT",conf="LOW",rr="0";if(score>=6){decision="BUY";conf="HIGH";rr="1:3";}else if(score>=4){decision="BUY";conf="MEDIUM";rr="1:2";}else if(score<=1){decision="SELL";conf="MEDIUM";rr="1:2";}
 const sl=decision==="BUY"?price-atrL*1.5:price+atrL*1.5;const tpMult=rr==="1:3"?4.5:3;const tp=decision==="BUY"?price+atrL*tpMult:price-atrL*tpMult;
 return {pair,price,score:score+"/7",pct:Math.round(score/7*100)+"%",decision,conf,rr,why:reasons.join(" | "),entry:price,sl,tp,atr:atrL,rsi:rsiLast};}
async function scanReal(){const apiKey=document.getElementById("apiKey").value.trim()||"demo";const btn=document.getElementById("scanBtn");btn.disabled=true;let results=[];document.getElementById("results").innerHTML="";document.getElementById("log").innerHTML="";
 for(let i=0;i<PAIRS.length;i++){const pair=PAIRS[i];document.getElementById("status").textContent=`Real ${i+1}/15: ${pair}...`;let candles=await fetchRealCandles(pair,apiKey);
  if(!candles){const base=pair==="XAU/USD"?2660:pair.includes("JPY")?150+Math.random()*50:1+Math.random()*0.5;candles=Array.from({length:200},()=>({open:base,high:base+0.002,low:base-0.002,close:base+(Math.random()-0.5)*0.01}));}
  const closes=candles.map(c=>c.close);const res=confluenceReal(pair,candles,{ema50:ema(closes,50),ema200:ema(closes,200),rsi:rsi(closes,14),atr:atr(candles,14),pa:getPA(candles),smc:getSMC(candles)});results.push(res);renderReal(results);if(apiKey==="demo")await sleep(8500);else await sleep(1200);}
 results.sort((a,b)=>parseInt(b.score)-parseInt(a.score));localStorage.setItem("dragon_real",JSON.stringify(results));document.getElementById("status").textContent=`✅ REAL DONE Top ${results[0].pair} ${results[0].decision} ${results[0].pct}`;btn.disabled=false;renderReal(results);}
async function scanSingle(){const apiKey=document.getElementById("apiKey").value.trim()||"demo";const pair="GBP/JPY";document.getElementById("log").innerHTML="";let candles=await fetchRealCandles(pair,apiKey);if(!candles){alert("API limit, get free key at twelvedata.com");return;}const closes=candles.map(c=>c.close);const res=confluenceReal(pair,candles,{ema50:ema(closes,50),ema200:ema(closes,200),rsi:rsi(closes,14),atr:atr(candles,14),pa:getPA(candles),smc:getSMC(candles)});document.getElementById("results").innerHTML="";renderReal([res]);}
function renderReal(results){const div=document.getElementById("results");const sorted=[...results].sort((a,b)=>parseInt(b.score)-parseInt(a.score));let html="";sorted.forEach((r,idx)=>{html+=`<div class="row ${idx===0?"top":""}"><div style="flex:1"><div><b>${idx===0?"🔥":""} ${r.pair}</b> <span class="badge">${r.price.toFixed(r.pair==="XAU/USD"?2:4)}</span> <span class="badge">RSI ${r.rsi.toFixed(1)}</span></div><div class="small" style="text-align:left">Score ${r.score} = ${r.pct} | ${r.conf} | R:R ${r.rr}</div><div style="font-size:10px;color:#ccc;margin-top:4px"><b>WHY?</b> ${r.why}</div>${r.decision!=="WAIT"?`<div style="font-size:10px;color:#7aa7ff;margin-top:4px"><b>ENTRY</b>
